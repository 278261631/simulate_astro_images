name: CI build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build render_sky_patch.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          install: mingw-w64-x86_64-gcc

      - name: Compile
        shell: msys2 {0}
        run: g++ -std=c++17 -O2 -static -static-libgcc -static-libstdc++ -o cpp/render_sky_patch.exe cpp/render_sky_patch.cpp

      - name: Smoke test
        shell: msys2 {0}
        run: |
          mkdir -p cpp/test_outputs
          ./cpp/render_sky_patch.exe --out cpp/test_outputs/default.bmp

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: render_sky_patch_win64
          path: cpp/render_sky_patch.exe
          if-no-files-found: error
